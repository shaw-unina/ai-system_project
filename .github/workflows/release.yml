name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write   # cosign keyless

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        image:
          - { name: "misinfo-app",      context: ".",         file: "Dockerfile" }
          - { name: "misinfo-frontend", context: "./frontend", file: "frontend/Dockerfile" }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          REF=${GITHUB_REF_NAME:-manual}
          SHORT=${GITHUB_SHA::7}
          echo "tags=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${REF},ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:sha-${SHORT}" >> $GITHUB_OUTPUT

      - name: Build & push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          for tag in $(echo "${{ steps.tags.outputs.tags }}" | tr ',' ' '); do
            cosign sign --yes "$tag@${{ steps.build.outputs.digest }}"
          done
        continue-on-error: true   # tolerate missing OIDC on first runs

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom-${{ matrix.image.name }}.spdx.json

      - name: Attach SBOM to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sbom-${{ matrix.image.name }}.spdx.json
