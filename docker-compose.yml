services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: misinfo:dev
    env_file:
      - .env
    environment:
      - LANGFUSE_HOST=http://langfuse-server:3000
      - MISINFO_BACKEND=${MISINFO_BACKEND:-groq}
    depends_on:
      - langfuse-server
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  langfuse-server:
    image: langfuse/langfuse:2
    depends_on:
      - langfuse-db
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@langfuse-db:5432/postgres
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-change-me-in-prod}
      - SALT=${LANGFUSE_SALT:-change-me-in-prod}
      - TELEMETRY_ENABLED=false
    ports:
      - "3000:3000"

  langfuse-db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data

  # ----- Phase 9 monitoring stack — opt-in via `--profile monitoring` -----
  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  # ----- Phase 10 frontend dashboard -----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: misinfo-frontend:dev
    environment:
      - BACKEND_URL=http://app:8000
      - NODE_ENV=production
    ports:
      - "3002:3000"
    depends_on:
      app:
        condition: service_healthy

volumes:
  langfuse-db-data:
  prometheus-data:
  grafana-data:
