[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "misinfo"
version = "0.0.1"
description = "LLM-based misinformation detection system."
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENCE" }
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv",
    "pyyaml",
    "loguru",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]
inference = [
    "groq>=0.11",
    "langfuse>=2,<3",
]
local = [
    "llama-cpp-python>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/misinfo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
